{{ define "main" }}
<article class="markdown notes-list">
  <h1>{{ .Title }}</h1>

    {{ .Content }}

  <ul class="notes-titles">
    {{ range .Pages.ByDate.Reverse }}
    <li>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        <time datetime="{{ .Date.Format "2006-01-02" }}"> &mdash; {{ .Date.Format "Jan 2, 2006" }}</time>
    </li>
    {{ end }}
  </ul>
</article>
{{ end }}
