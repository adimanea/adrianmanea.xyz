name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all history for features like .Lastmod
          submodules: recursive

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # The Book theme compiles book.scss via css.Sass, which needs Sass support.
      # peaceiris/actions-hugo with hugo-version 'latest' put the STANDARD Hugo
      # 0.170.1 on PATH -> "no Dart Sass binary found in $PATH". Fix: install the
      # pinned EXTENDED release into /tmp/hugo-bin and prepend it to PATH via
      # $GITHUB_PATH so it shadows any image-provided hugo; also ship standalone
      # dart-sass (provides `sass` in PATH) as a fallback that works with the
      # standard binary too. Verified locally: extended hugo alone builds the
      # site; standard hugo + dart-sass in PATH builds it as well.
      - name: Setup Hugo Extended + Dart Sass
        run: |
          set -e
          HUGO_VERSION="0.170.1"
          SASS_VERSION="1.93.3"
          mkdir -p /tmp/hugo-bin
          curl -sfL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" -o /tmp/hugo-extended.tar.gz
          tar -xzf /tmp/hugo-extended.tar.gz -C /tmp/hugo-bin
          curl -sfL "https://github.com/sass/dart-sass/releases/download/${SASS_VERSION}/dart-sass-${SASS_VERSION}-linux-x64.tar.gz" -o /tmp/dart-sass.tar.gz
          tar -xzf /tmp/dart-sass.tar.gz -C /tmp
          echo "/tmp/hugo-bin" >> "$GITHUB_PATH"
          echo "/tmp/dart-sass" >> "$GITHUB_PATH"
          # $GITHUB_PATH only applies from the NEXT step, so verify via absolute paths here
          ls -la /tmp/hugo-bin
          /tmp/hugo-bin/hugo version
          /tmp/dart-sass/sass --version

      - name: Build with Hugo
        run: |
          which hugo sass || true
          hugo version
          hugo \
          --gc \
          --minify \
          --baseURL "https://adrianmanea.xyz/"

      # 🌟 UPGRADED TO V5: Supports Node 24 natively & resolves upload validation changes
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # 🌟 UPGRADED TO V5: Completely eliminates Node 20 deprecation issues
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

