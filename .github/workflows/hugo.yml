name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all history for features like .Lastmod
          submodules: recursive

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true # The Book theme utilizes Sass/SCSS, which requires Hugo Extended

      - name: Build with Hugo
        run: |
          hugo \
          --gc \
          --minify \
          --baseURL "https://adrianmanea.xyz/"

      # 🌟 UPGRADED TO V5: Supports Node 24 natively & resolves upload validation changes
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # 🌟 UPGRADED TO V5: Completely eliminates Node 20 deprecation issues
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

