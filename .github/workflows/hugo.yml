name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all history for features like .Lastmod
          submodules: recursive

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # The Book theme compiles book.scss via css.Sass, which needs Hugo EXTENDED
      # (embedded Dart Sass). peaceiris/actions-hugo with hugo-version 'latest'
      # installed the STANDARD binary on the last run -> "no Dart Sass binary found
      # in $PATH". Download the extended release directly, pinned, so the binary is
      # guaranteed to be extended.
      - name: Setup Hugo Extended (pinned)
        run: |
          HUGO_VERSION="0.170.1"
          curl -sL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" -o /tmp/hugo-extended.tar.gz
          tar -xzf /tmp/hugo-extended.tar.gz -C /tmp
          sudo install -m 0755 /tmp/hugo /usr/local/bin/hugo
          hugo version

      - name: Build with Hugo
        run: |
          hugo \
          --gc \
          --minify \
          --baseURL "https://adrianmanea.xyz/"

      # 🌟 UPGRADED TO V5: Supports Node 24 natively & resolves upload validation changes
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # 🌟 UPGRADED TO V5: Completely eliminates Node 20 deprecation issues
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

